<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP8266 Dashboard</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: auto;
      max-width: 1000px;
    }

    h2 {
      color: #2c3e50;
      text-align: center;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 5px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2980b9;
    }

    #chart_temp, #chart_status {
      width: 100%;
      height: auto;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      button {
        flex: 1 1 100%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h2>📊 ESP8266 Dashboard</h2>
  <div class="button-group">
    <button onclick="drawCharts('today')">วันนี้</button>
    <button onclick="drawCharts('week')">สัปดาห์นี้</button>
    <button onclick="drawCharts('month')">เดือนนี้</button>
    <button onclick="drawCharts('year')">ปีนี้</button>
  </div>
  <div id="chart_temp" style="height: 400px; text-align: center; color: #888;">
    <p>⏳ กำลังโหลดข้อมูลล่าสุด...</p>
  </div>
  <div id="chart_status" style="height: 300px;"></div>

  <script>
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(() => drawCharts('latest'));

    function drawCharts(range) {
      document.getElementById('chart_temp').innerHTML = "⏳ กำลังโหลดข้อมูล...";
      document.getElementById('chart_status').innerHTML = "";

      fetch('https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec?mode=getData&range=' + range)
        .then(response => response.json())
        .then(data => {
          const tempData = [['Timestamp', 'Temperature', 'Humidity']];
          const statusData = [['Timestamp', 'Status']];

          data.forEach(row => {
            const time = new Date(row.Timestamp);
            if (isNaN(time)) return;

            const temp = parseFloat(row.Temperature);
            const hum = parseFloat(row.Humidity);
            const status = row.Status === "ON" ? 1 : 0;

            if (!isNaN(temp) && !isNaN(hum)) {
              tempData.push([time, temp, hum]);
            }
            statusData.push([time, status]);
          });

          if (tempData.length <= 1) {
            document.getElementById('chart_temp').innerHTML = "❌ ไม่มีข้อมูลให้แสดง";
            document.getElementById('chart_status').innerHTML = "";
            return;
          }

          const tempTable = google.visualization.arrayToDataTable(tempData);
          const statusTable = google.visualization.arrayToDataTable(statusData);

          const tempOptions = {
            title: 'Temperature & Humidity',
            curveType: 'function',
            legend: { position: 'bottom' },
            hAxis: { title: 'Time' },
            vAxis: { title: 'Value' }
          };

          const statusOptions = {
            title: 'Device Status (ON = 1, OFF = 0)',
            legend: 'none',
            hAxis: { title: 'Time' },
            vAxis: {
              title: 'Status',
              ticks: [{v:0, f:'OFF'}, {v:1, f:'ON'}]
            }
          };

          new google.visualization.LineChart(document.getElementById('chart_temp')).draw(tempTable, tempOptions);
          new google.visualization.ColumnChart(document.getElementById('chart_status')).draw(statusTable, statusOptions);
        })
        .catch(error => {
          console.error("❌ Error fetching data:", error);
          document.getElementById('chart_temp').innerHTML = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
        });
    }
  </script>
</body>
</html>
